name: Build

# Push builds only main; every pull request (any branch) builds through pull_request, so a branch with an open PR is not built twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the scripts
        run: |
          bash -n scripts/*.sh
          shellcheck --severity=warning scripts/*.sh

      - name: Build and test
        run: ./gradlew build --console=plain

      # also (and especially) when the build failed
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests/test/
            */build/test-results/test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: plugin/build/libs/*.jar
          if-no-files-found: error

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: resource-pack
          path: packgen/build/pack/
          if-no-files-found: error
