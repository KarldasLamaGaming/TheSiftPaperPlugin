name: Release

# Builds the plugin and the resource pack for a version and attaches them to its GitHub release.
# Two ways to start it:
# - publish a release in the GitHub UI with a new tag v<version> (e.g. v0.1.0-alpha.1); the files are
#   attached to that release
# - push a tag v<version>; the release is created (tags with "-" such as -alpha.1 as pre-release)
# The plugin's default resource-pack.url points to the pack of the release that matches its version.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

# creating a release in the UI can also fire the tag push; one run per tag is enough
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and pack
        run: ./gradlew build -PreleaseVersion="${TAG#v}" --console=plain

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          files=("plugin/build/libs/TheSift-$version.jar" packgen/build/pack/the-sift-pack.zip packgen/build/pack/the-sift-pack.zip.sha1)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            prerelease=""
            if [[ "$version" == *-* ]]; then prerelease="--prerelease"; fi
            sha1="$(cat packgen/build/pack/the-sift-pack.zip.sha1)"
            gh release create "$TAG" $prerelease --title "The Sift $version" \
              --notes "Plugin und Resource Pack für Paper 26.3. Resource Pack SHA-1: $sha1" "${files[@]}"
          fi
