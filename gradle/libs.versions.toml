[versions]
# Pinned to the newest stable Paper build for Minecraft 26.3 (checked in the PaperMC Maven repo;
# <latest> in maven-metadata.xml still points to an old pre-release, so never use a dynamic version)
paper = "26.3.build.227-stable"
minecraft = "26.3"
junit = "6.1.3"
shadow = "9.6.1"
runPaper = "3.1.0"
adventureNbt = "5.2.0"
gson = "2.14.0"
snakeyaml = "2.6"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventureNbt" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
