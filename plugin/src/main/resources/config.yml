# The Sift – Konfiguration
# Änderungen an Abschnitten, die beim Serverstart gelesen werden (markiert mit [Start]),
# wirken erst nach einem Neustart.
#
# Inhalt (Abschnitte der obersten Ebene, in dieser Reihenfolge; Erklärungen in docs/ADMIN.md):
#   custom-blocks   Platzieren, Abbau und Update-Schutz der Sift-Blöcke
#   blocks          Härte, Werkzeug, Drops, Feuer je Sift-Block
#   plant-support   Untergrund, auf dem Sift-Pflanzen stehen dürfen
#   worldgen        Weltgenerierung der Sift (Bäume, Seen, Schluchten, Monolithen, Höhlen …) [Start]
#   admin           Admin-Befehle mit Schutzschalter (Spieler-Reset)
#   weather         Wetter und Ichor-Schneefall in der Sift
#   atmosphere      Intro-Klang und Atmosphäre
#   ichor           Ichor-Verhalten und Identität (Ichor bleibt Ichor, Wasser bleibt Wasser)
#   rifts           Risse (Ein- und Ausgänge, Gegen-Risse)
#   siftite         Siftit-Erhalt beim Tod
#   access          Zeitsperre der Sift (Drachenkill, Datum, manuell)
#   portals         Portale, Schreine, Schlüssel, Schlüssel-Rezepte, Kompass, Antike Stadt
#   items           Werte der Sift-Items (Siftit-Ausrüstung, Essen, Getränke, Schallplatten)
#   mobs            Sift-Mobs (Blub, Sifter, Singer, Dunkler Schnüffler, Echo Golem, Allays)
#   recipes         Rezeptbuch beim Join
#   resource-pack   Resource Pack (URL, Pflicht, Texte)
#   phase4          Eigene Inhalte nach dem Original-Port: Boss-Items (ab alpha.39), Sculk Enchanter (ab alpha.40),
#                   Tempel (ab alpha.41a), Tempel-Kompass und Gerüchte-Zettel (ab alpha.41b); später Bosse
#
# Neue Einstellungen eines Updates fügt das Plugin beim Start selbst hinzu; was schon in der Datei steht, bleibt.

custom-blocks:
  # Eigene Blöcke nur in der Sift platzieren. Andere Welten brauchen dann die block-updates-Schalter nicht.
  place-only-in-sift: true
  # Was außerhalb der Sift passiert: deny = nicht platzieren (Hinweis an den Spieler),
  # vanilla = den unter blocks.<id>.fallback eingetragenen Vanilla-Block setzen
  outside-sift-fallback: deny
  # Ausnahmen von place-only-in-sift: diese Blöcke dürfen auch in anderen Welten stehen
  # (Konsolen der Portale in Overworld, Nether und End)
  placeable-outside-sift: [sonorous_deepslate]
  # Abbauzeit: alle N Ticks wird für den Block im Fadenkreuz die Abbaugeschwindigkeit gesetzt, damit Client und
  # Server sie schon vor dem ersten Schlag kennen (sonst bauen Eisen-, Diamant-, Netherit- und Goldäxte alle Sift-Blöcke
  # auf Pilzblöcken sofort ab). 0 = nur beim Klick (nicht empfohlen).
  break-speed-target-ticks: 2

# Verhalten der eigenen Blöcke (Werte nach Mielon's The Sift 1.1.1).
#   hardness       Abbauhärte wie Vanilla (Tiefenschiefer 3.0); unbreakable: true = unzerstörbar
#   tool           pickaxe | shovel | axe | hoe | shears | none
#   requires-tool  true = droppt nur mit passendem Werkzeug (und baut ohne es langsam ab)
#   tier           Mindeststufe: wood | stone | copper | iron | diamond | netherite
#   drops.type     self | silk-or | ore | chance | shears-or-silk | silk-only | none
#                  (item, min, max, chances je nach Typ; ore: Glück wie Vanilla-Erze)
#   xp             [min, max] Erfahrung beim Abbau ohne Behutsamkeit
#   explosion-proof true = Explosionen lassen den Block stehen
#   support        Untergrund für Pflanzen: face below|above, blocks = erlaubte Blöcke
#                  (Sift-Ids, minecraft:-Ids, #minecraft:tags; leer = jeder feste Block)
#   fallback       Vanilla-Block für outside-sift-fallback: vanilla
#   fire           [Entzünden, Verbrennen] wie Vanilla-Brennbarkeit (Stamm 5/5, Bretter 5/20, Laub 30/60)
#   fuel           Brenndauer im Ofen in Ticks (Stamm/Bretter 300, Setzling 100)
blocks:
  siftslate: {hardness: 3.0, tool: pickaxe, requires-tool: true, drops: {type: silk-or, item: "the_sift:cobbled_siftslate"}, fallback: "minecraft:deepslate"}
  cobbled_siftslate: {hardness: 3.5, tool: pickaxe, requires-tool: true, drops: {type: self}, fallback: "minecraft:cobbled_deepslate"}
  siftslate_growth: {hardness: 1.5, tool: pickaxe, requires-tool: true, drops: {type: silk-or, item: "the_sift:siftslate"}, fallback: "minecraft:deepslate"}
  reinforced_siftslate: {unbreakable: true, explosion-proof: true, drops: {type: none}, fallback: "minecraft:reinforced_deepslate"}
  sonorous_deepslate: {hardness: 55.0, tool: none, explosion-proof: true, drops: {type: none}, fallback: "minecraft:reinforced_deepslate"}
  siftslate_bricks: {hardness: 3.5, tool: pickaxe, requires-tool: true, drops: {type: self}, fallback: "minecraft:deepslate_bricks"}
  chiseled_siftslate: {hardness: 3.5, tool: pickaxe, requires-tool: true, drops: {type: self}, fallback: "minecraft:chiseled_deepslate"}
  siftslate_coal_ore: {hardness: 4.5, tool: pickaxe, requires-tool: true, tier: wood, drops: {type: ore, item: "minecraft:coal", min: 1, max: 1}, xp: [0, 2], fallback: "minecraft:deepslate"}
  siftslate_diamond_ore: {hardness: 4.5, tool: pickaxe, requires-tool: true, tier: iron, drops: {type: ore, item: "minecraft:diamond", min: 1, max: 1}, xp: [3, 7], fallback: "minecraft:deepslate"}
  siftslate_emerald_ore: {hardness: 4.5, tool: pickaxe, requires-tool: true, tier: iron, drops: {type: ore, item: "minecraft:emerald", min: 1, max: 1}, xp: [3, 7], fallback: "minecraft:deepslate"}
  siftslate_charoite_ore: {hardness: 4.5, tool: pickaxe, requires-tool: true, tier: stone, drops: {type: ore, item: "the_sift:charoite", min: 4, max: 9}, xp: [2, 5], fallback: "minecraft:deepslate"}
  siftslate_siftite_ore: {hardness: 4.5, tool: pickaxe, requires-tool: true, tier: diamond, drops: {type: ore, item: "the_sift:siftite_nugget", min: 1, max: 1}, xp: [3, 7], fallback: "minecraft:deepslate"}
  sift_rubble: {hardness: 0.6, tool: shovel, drops: {type: chance, item: "the_sift:ichor_shard", chances: [0.1, 0.14285715, 0.25, 1.0]}, fallback: "minecraft:gravel"}
  ichor_snow_block: {hardness: 0.2, tool: shovel, requires-tool: true, drops: {type: silk-or, item: "the_sift:ichor_snowball", min: 4, max: 4}, fallback: "minecraft:snow_block"}
  soul_block: {hardness: 0.35, tool: shovel, drops: {type: none}, fallback: "minecraft:soul_soil"}
  # Sculk Enchanter (Phase 4, ab alpha.40.1): eigener Block, abbaubar mit der Spitzhacke, droppt sich selbst
  siftite_block: {hardness: 5.0, tool: pickaxe, requires-tool: true, drops: {type: self}, fallback: "minecraft:iron_block"}
  charoite_block: {hardness: 4.0, tool: pickaxe, requires-tool: true, drops: {type: self}, fallback: "minecraft:amethyst_block"}
  sculk_enchanter: {hardness: 5.0, tool: pickaxe, requires-tool: true, explosion-proof: true, drops: {type: self}, fallback: "minecraft:enchanting_table"}
  healthy_sculk: {hardness: 0.2, tool: hoe, drops: {type: self}, fallback: "minecraft:sculk"}
  dry_healthy_sculk: {hardness: 0.2, tool: hoe, drops: {type: self}, fallback: "minecraft:sculk"}
  dry_healthy_sculk_growth: {hardness: 0.2, tool: hoe, drops: {type: silk-or, item: "the_sift:dry_healthy_sculk"}, fallback: "minecraft:sculk"}
  ichor_glass: {hardness: 0.3, tool: none, drops: {type: silk-only}, fallback: "minecraft:purple_stained_glass"}
  siftslate_stalks: {hardness: 0, drops: {type: shears-or-silk}, support: {face: below, blocks: [sift]}, fallback: "minecraft:short_grass"}
  healthy_sculk_sprouts: {hardness: 0, drops: {type: shears-or-silk}, support: {face: below, blocks: [sift]}, fallback: "minecraft:short_grass"}
  dry_healthy_sculk_sprouts: {hardness: 0, drops: {type: shears-or-silk}, support: {face: below, blocks: [sift]}, fallback: "minecraft:short_grass"}
  overgrown_chard: {hardness: 0, drops: {type: shears-or-silk}, support: {face: below, blocks: [sift]}, fallback: "minecraft:fern"}
  overgrown_stalks: {hardness: 0, drops: {type: shears-or-silk}, support: {face: below, blocks: [sift]}, fallback: "minecraft:short_grass"}
  overgrown_fronds: {hardness: 0, drops: {type: shears-or-silk}, support: {face: below, blocks: [sift]}, fallback: "minecraft:fern"}
  sunburst_plant: {hardness: 0, drops: {type: self}, support: {face: below, blocks: [sift]}, fallback: "minecraft:dandelion"}
  whisperbloom: {hardness: 0, drops: {type: self}, support: {face: below, blocks: [sift]}, fallback: "minecraft:allium"}
  sculkflower: {hardness: 0, drops: {type: self}, support: {face: below, blocks: [sift]}, fallback: "minecraft:torchflower"}
  sculkflower_crop: {hardness: 0, drops: {type: self, item: "the_sift:sculkflower_seeds"}, support: {face: below, blocks: [sift]}, fallback: "minecraft:air"}
  overgrown_willow_sapling: {hardness: 0, drops: {type: self}, support: {face: below, blocks: [sift]}, fallback: "minecraft:mangrove_propagule", fire: [60, 100], fuel: 100}
  overgrown_lotus: {hardness: 0, drops: {type: self}, support: {face: below, blocks: [sift]}, fallback: "minecraft:fern"}
  # Weiden-Set: Achse beim Setzen nach angeklickter Fläche, Entrinden mit Axt (Rechtsklick)
  overgrown_willow_log: {hardness: 2.0, tool: axe, drops: {type: self}, fallback: "minecraft:mangrove_log", fire: [5, 5], fuel: 300}
  overgrown_willow_wood: {hardness: 2.0, tool: axe, drops: {type: self}, fallback: "minecraft:mangrove_wood", fire: [5, 5], fuel: 300}
  stripped_overgrown_willow_log: {hardness: 2.0, tool: axe, drops: {type: self}, fallback: "minecraft:stripped_mangrove_log", fire: [5, 5], fuel: 300}
  stripped_overgrown_willow_wood: {hardness: 2.0, tool: axe, drops: {type: self}, fallback: "minecraft:stripped_mangrove_wood", fire: [5, 5], fuel: 300}
  overgrown_willow_planks: {hardness: 2.0, tool: axe, drops: {type: self}, fallback: "minecraft:mangrove_planks", fire: [5, 20], fuel: 300}
  # Original: Laub-Kopie mit Härte 0.7, droppt immer sich selbst; zerfällt hier nicht (fester Block)
  overgrown_willow_foliage: {hardness: 0.7, tool: hoe, drops: {type: self}, fallback: "minecraft:mangrove_leaves", fire: [30, 60]}
  siftslate_hanging_roots: {hardness: 0, drops: {type: shears-or-silk}, support: {face: above, blocks: []}, fallback: "minecraft:hanging_roots"}
  overgrown_hanging_roots: {hardness: 0, drops: {type: shears-or-silk}, support: {face: above, blocks: []}, fallback: "minecraft:hanging_roots"}

# Untergrund "sift" in support.blocks steht für diese Liste (Tag sift_plant_support des Originals
# plus #minecraft:supports_vegetation, wie SiftPlantBlock#mayPlaceOn)
plant-support:
  - "the_sift:siftslate"
  - "the_sift:siftslate_growth"
  - "the_sift:healthy_sculk"
  - "the_sift:dry_healthy_sculk"
  - "the_sift:dry_healthy_sculk_growth"
  - "#minecraft:supports_vegetation"

# Weltgenerierung der Sift (Werte nach Mielon's The Sift 1.1.1). [Start] Gilt für neu generierte Chunks.
# biomes: Biome der Sift ohne "the_sift:"; Häufigkeiten wie im Original (rarity N = in jedem N-ten Chunk).
worldgen:
  willow-trees:
    enabled: true
    # Anteil großer Weiden (sonst kleine)
    big-chance: 0.38
    dense: {count: 5, biomes: [overgrown_forest, overgrown_forest_slopes, overgrown_peaks]}
    sparse: {rarity: 7, biomes: [overgrown_clearing, overgrown_slopes, ichor_snowy_peaks]}
  flower-patches:
    enabled: true
    rarity: 9
    biomes: [ichor_snowy_peaks, overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes, sift_deep_dark, siftslate_peaks, siftslate_slopes]
    wastes: {rarity: 7, biomes: [sift_wastes]}
  plant-patches:
    enabled: true
    rarity: 10
    biomes: [ichor_snowy_peaks, overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes, sift_deep_dark, sift_wastes, siftslate_peaks, siftslate_slopes]
  surface-sculk:
    enabled: true
    biomes: [overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes, sift_wastes, siftslate_peaks, siftslate_slopes]
  abandoned-portals:
    enabled: true
    # ein Kandidat je Zelle aus N × N Chunks (Original 1.1.1: 20), immer im mittleren Drittel der Zelle
    cell-chunks: 20
    # Anteil der Kandidaten, die bauen dürfen (0.0–1.0). Original = 1.0. Seit alpha.28 (Schluchten, Seen,
    # Monolithen, Höhlen nehmen wie im Original Platz weg) ergibt 1.0 dieselbe Menge wie das Original.
    chance: 1.0
    biomes: [ichor_snowy_peaks, overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes, sift_wastes, siftslate_peaks, siftslate_slopes]
    chest-loot: "the_sift:chests/abandoned_portal"
  main-portal:
    # Haupt-Portal beim ersten Start in der Nähe von 0/0 bauen
    enabled: true
  # Seelenschluchten (Original 1.1.1): höchstens eine je Zelle aus N × N Chunks, ein mäandernder Graben mit
  # Seelenblöcken im Boden; Heimat des Echo Golems. Nur neue Chunks; /sift debug canyon build baut eine von Hand.
  # Ichor-Seen an der Oberfläche (ab alpha.25, Original 1.1.1): SMALL bis MEGA je nach Gelände, mit Strand,
  # Felsformationen und Ufer-Pflanzen. Kaskaden und Weideninseln folgen später. Nur neue Chunks.
  ichor-lakes:
    enabled: true
    # 1 von N Chunks versucht einen See (Original: 1/3, in Lichtungen 1/2)
    rarity: 3
    biomes: [ichor_snowy_peaks, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, sift_wastes, siftslate_peaks, siftslate_slopes]
    clearing-rarity: 2
    clearing-biomes: [overgrown_clearing, overgrown_slopes]
    # Leuchten wie im Original: Lichtblöcke Stufe 12 in der Luft direkt über der Oberfläche, je N Blöcke einer (0 = aus).
    # Seit alpha.36 nie im Ichor selbst (ein wassergeloggter Lichtblock ist eine unsichtbare, dauerhafte Quelle)
    light-spacing: 3
    shore-plants: true
  # Ichor-Schnee (ab alpha.26, Original 1.1.1): in ichor_snowy_peaks 1–2 Schichten Schnee auf jedem natürlichen
  # Boden (kleine Pflanzen werden ersetzt), auch auf Weidenkronen. Nur neue Chunks.
  ichor-snow:
    enabled: true
    willow-crowns: true
  # Monolithen (ab alpha.27, Original 1.1.1): schiefe, sich verjüngende Siftslate-Säulen mit Terrassen und
  # 0–3 kleineren Nebensäulen. Üppige (Radius 5–7, Höhe 31–55) tragen oben Siftslate-Bewuchs mit Pflanzen,
  # kahle (Radius 4–6, Höhe 24–44) nicht. 1 von N Chunks, wenn die gewürfelte Stelle in einem der Biome liegt.
  # Nur neue Chunks; /sift debug landmarks zeigt die nächsten mit Teleport.
  monoliths:
    enabled: true
    lush:
      enabled: true
      overgrown: {rarity: 11, biomes: [overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes]}
      wastes: {rarity: 8, biomes: [ichor_snowy_peaks, sift_wastes, siftslate_slopes]}
    bare:
      enabled: true
      overgrown: {rarity: 20, biomes: [overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes]}
      wastes: {rarity: 15, biomes: [ichor_snowy_peaks, sift_wastes, siftslate_peaks, siftslate_slopes]}
    # Mindestabstand zum Haupt-Portal und reservierte Fläche ±N Blöcke (gegen Seen, Portale, andere Monolithen)
    portal-clearance: 22
    reserve-radius: 22
  # Felsbögen (ab alpha.27, Original 1.1.1): Brücke aus Sculk oder Siftslate über eine Senke, 26–30 Blöcke
  # zwischen den Füßen. 1 von N Chunks; gebaut wird nur, wo eine Achse durch die Chunk-Mitte eine Senke findet.
  arches:
    enabled: true
    rarity: 5
    biomes: [ichor_snowy_peaks, overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes,
      sift_wastes, siftslate_peaks, siftslate_slopes]
    portal-clearance: 23
  # Trockene Sculk-Spitzen (ab alpha.30, Original 1.1.1): schiefe, spitz zulaufende Spitze aus trockenem Sculk
  # (Radius 3–4, 19–31 hoch) mit 2–4 kleineren daneben. 1 von N Chunks, wenn die gewürfelte Stelle in einem der
  # Biome liegt. /sift debug landmarks zeigt die nächsten mit Teleport.
  dry-sculk-spikes:
    enabled: true
    overgrown: {rarity: 21, biomes: [overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes]}
    wastes: {rarity: 16, biomes: [ichor_snowy_peaks, sift_wastes, siftslate_peaks, siftslate_slopes]}
    portal-clearance: 18
    reserve-radius: 18
  # Bewuchs aufräumen (ab alpha.30, Original 1.1.1), in jedem Chunk zuletzt: Siftschiefer-Bewuchs und trockener
  # Sculk-Bewuchs unter einem vollen Block werden wieder kahl, Bewuchs auf trockenem Sculk wird trockener Bewuchs,
  # verschneiter Bewuchs passt zum Ichor-Schnee, und Pflanzen, die über Ichor in der Luft hängen, werden entfernt.
  covered-growth-cleanup:
    enabled: true
    # so viele Blöcke unter der Oberfläche wird geprüft (Original: 56). Bedeckter Bewuchs entsteht praktisch nur
    # direkt unter der Oberfläche (gemessen: bei 8 gleich viele Funde je Chunk wie bei 56); 16 kostet etwa 2,5 ms
    # je neuem Chunk, 56 etwa 8 ms.
    depth: 16
  # Lavaboden (ab alpha.30, Original 1.1.1): jeder Luftblock bis y 11 wird Lava (tiefe Höhlen enden in Lava).
  lava-floor:
    enabled: true
    max-y: 11
  # Schnüffler-Höhlen (ab alpha.28, Original 1.1.1): vom Chunk-Mittelpunkt ein gewundener Gang 9 Blöcke hinab
  # in eine Nest-Kammer aus Sculk, mit Ichor-Becken in einer Nebenkammer, Fackellilien oder Kannenpflanzen,
  # Nest aus Weidenlaub (Pflanzen, manchmal ein Schnüffler-Ei) und einer Schnüffler-Familie (2 Erwachsene,
  # zu 33 % ein Junges). Je Zelle aus N × N Chunks sind mehrere Chunks Kandidat. Nur neue Chunks;
  # /sift debug landmarks zeigt die nächsten Höhlen mit Teleport.
  sniffer-caves:
    enabled: true
    overgrown: {cell-chunks: 16, candidates: 4, biomes: [overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes]}
    wastes: {cell-chunks: 28, candidates: 3, biomes: [ichor_snowy_peaks, sift_wastes, siftslate_peaks, siftslate_slopes]}
    # Mindestabstand des Nests zum Haupt-Portal (Blöcke)
    portal-clearance: 12
    # Schnüffler-Familie im Nest erzeugen
    family: true
    # Ichor-Becken leuchten wie die Seen (Lichtblöcke Stufe 12 über dem Ichor, Abstand wie ichor-lakes.light-spacing)
    ichor-light: true
  # Schnüffler-Pflanzenflecken (Original: 1 von 14 Chunks): 5–9 Fackellilien oder Kannenpflanzen auf Sculk
  # oder Siftschiefer-Bewuchs um die Chunk-Mitte.
  sniffer-plant-patches:
    enabled: true
    rarity: 14
    biomes: [overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes, sift_wastes,
      siftslate_peaks, siftslate_slopes]
  # Ichor-Quellen in Felswänden unter Tage (Original: 16 Versuche je Chunk, y 15–110, mindestens 12 unter der Oberfläche)
  ichor-springs:
    enabled: true
    count: 16
    min-y: 15
    max-y: 110
    below-surface: 12
    # Lichtblock Stufe 12 in der Luft über der Öffnung der Quelle (die Quelle selbst ist normales Ichor, seit alpha.36)
    light: true
  soul-canyons:
    enabled: true
    cell-chunks: 12
    # Mindestabstand zum Haupt-Portal (Blöcke)
    portal-clearance: 34
    # so viele Seelenblöcke braucht eine Schlucht, sonst wird sie nicht gebaut
    min-souls: 8
    biomes: [ichor_snowy_peaks, overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_peaks, overgrown_slopes, sift_deep_dark, sift_wastes, siftslate_peaks, siftslate_slopes]
    # Aufsteigende Seelen-Partikel über offenen Seelenblöcken (wie im Original). Die alte Form "particles: true"
    # bzw. "false" geht weiter (dann gelten die Standardwerte unten).
    particles:
      enabled: true
      # Partikelart ohne Zusatzdaten, z. B. SCULK_SOUL (gut sichtbar) oder SOUL (klein, wie das Original)
      type: SCULK_SOUL
      # Partikel je Seelenblock und Lauf
      amount: 3
      # so viele offene Seelenblöcke je Schlucht bekommen pro Lauf Partikel
      souls-per-run: 4
      # ein Seelenblock gilt als offen, wenn so viele Blöcke darüber frei (Luft, Pflanzen) sind (Original: 50)
      air-above: 4
      # nur Spieler in diesem Abstand zur Schlucht sehen die Partikel; nur dann läuft die Schlucht überhaupt
      view-distance: 48
      # alle N Ticks ein Lauf
      interval-ticks: 10

# Go-live: /sift admin reset-players setzt alle Spieler für die Sift auf null (Intro, Siftit-Sicherungen, alle
# Sift-Daten im Spieler, Sift-Advancements, Sift-Gegenstände in Inventar, Endertruhe und Shulkerkisten).
# Recht thesift.admin.reset. Aus Sicherheit standardmäßig aus; nur für den Reset einschalten, danach wieder aus.
# Spieler, die beim Reset offline sind, werden beim nächsten Login zurückgesetzt, solange enabled true ist.
admin:
  reset-players:
    enabled: false

# Wetter in der Sift (ab alpha.32, Original 1.1.1). Was über Paper nicht geht, steht in docs/ABWEICHUNGEN.md
# → „Himmel und Atmosphäre“.
weather:
  # Ichor-Schneefall: Bei Niederschlag schneit es in der Sift nur in ichor_snowy_peaks, dort aber in jeder Höhe
  # (das Plugin setzt beim Start die Temperatur des Bioms im Datapack auf `temperature`; Vanilla schneit nur unter
  # 0,15). Nur bei Blocklicht unter 10, höchstens `max-layers` Schichten. Temperatur wirkt nach einem Neustart.
  ichor-snowfall:
    enabled: true
    temperature: 0.0
    max-layers: 2
  # Ichor friert im Original nie zu (eigene Flüssigkeit); hier ist er Wasser, false verhindert Eis
  ichor-freezes: false

# Himmel und Atmosphäre der Sift (ab alpha.29). Was ein Vanilla-Client davon zeigen kann, steht in
# docs/ABWEICHUNGEN.md → „Himmel und Atmosphäre“.
atmosphere:
  # Wolken in der Sift zeigen. Das Original zeigt sie nur bei Regen, ein Vanilla-Client kann das nicht;
  # false blendet sie ganz aus (Alpha 0 der Wolkenfarbe im Datapack). Wirkt nach einem Neustart.
  clouds: false
  # Intro-Klang (the_sift:sift_intro) einmal je Spieler beim ersten Betreten der Sift, wie im Original
  intro-sound:
    enabled: true
    volume: 0.4
    # erst abspielen, wenn der Spieler so viele Ticks in der Sift ist und Boden in 8 Blöcken unter sich hat
    # (das Original wartet auf das Ende des Ladebildschirms)
    delay-ticks: 20

# Werte der Sift-Items (Neustart nötig; bereits vorhandene Items behalten ihre alten Werte).
# Portale (Schritt 7): Durchgang in die Sift und zurück, Konsolen aus Klingendem Tiefenschiefer
ichor:
  # Ichor-Verhalten (ab alpha.21). In der Sift ist alles Wasser Ichor.
  enabled: true
  # Regeneration für Lebewesen im Ichor (Original: Regeneration I, 101 Ticks, ohne Partikel)
  regeneration:
    enabled: true
    amplifier: 0
    duration-ticks: 101
    interval-ticks: 10
  # Bremsung im Ichor wie im Original (×0,92 waagrecht, ×0,94 senkrecht je Tick), nur Mobs und Items;
  # Spieler werden nicht gebremst (würde ruckeln)
  drag-mobs:
    enabled: true
    horizontal: 0.92
    vertical: 0.94
    interval-ticks: 2
  # false = Ichor bildet keine unendlichen Quellen (Gamerule water_source_conversion der Sift)
  source-conversion: false
  # Lava an Ichor: fließende Lava → Siftschiefer-Bruchstein, Lava auf Ichor → Siftschiefer (Quelle → Obsidian)
  lava-results: true
  # Eimer an Ichor ergibt einen Ichor-Eimer (auch am vollen Kessel)
  bucket: true
  # Glasflasche an einer Ichor-Quelle oder einem Kessel in der Sift ergibt eine Ichor-Flasche;
  # eine Ichor-Flasche füllt einen Kessel um eine Stufe
  bottles: true
  # Identität (ab alpha.38): Standard ist „in der Sift Ichor, sonst Wasser“. Nur Ausnahmen werden je Block im Chunk
  # gespeichert: Wasser aus einem Wassereimer in der Sift bleibt Wasser, Ichor aus einem Ichor-Eimer außerhalb bleibt
  # Ichor (Regeneration, Bremsung, Eimer, Flasche, Kessel). Fließendes Wasser erbt die Art seines Ursprungs.
  identity:
    enabled: true
    # Regeneration und Bremsung auch außerhalb der Sift in ausgegossenem Ichor (nur in Welten mit Markierungen)
    outside-sift: true
  # Advancement „False Alarm“: ein geworfener Ichor-Schneeball trifft etwas in 16 Blöcken eines Wärters (ab alpha.26)
  false-alarm: true
  # Nebel-Partikel (Staub in Ichorfarben) über Ichor-Quellen nahe Spielern
  mist:
    enabled: true
    interval-ticks: 20
    radius: 16
    samples: 24

rifts:
  # Risse (ab alpha.22) wie im Original: Sie öffnen sich von selbst nahe Spielern in der Sift und führen
  # hinaus zum Respawnpunkt; dort öffnet sich ein Gegen-Riss, der bis zum Schließen zurückführt.
  # Risse in die Sift beachten die Zeitsperre (access.*); Gegen-Risse öffnen sich nur, wenn die Sift offen ist.
  # Offene Risse überstehen keinen Neustart.
  # Seit alpha.42a.2 standardmäßig aus: Zugang nur über die Portale mit Schlüssel. Aus heißt ganz aus (auch das Item
  # sift_rift und /sift rift); Lichtblöcke alter Risse werden beim Laden der Chunks entfernt. Der Mini-Riss beim
  # Siftit-Erhalt (siftite.keep-on-death) hängt nicht davon ab. Eine bestehende config.yml behält ihren Wert.
  enabled: false
  natural:
    enabled: true
    # erster Riss nach dem Betreten, danach Abstand (+ Zufallsanteil), bei Fehlschlag neuer Versuch
    first-delay-ticks: 5400
    interval-ticks: 5400
    interval-random-ticks: 1200
    retry-ticks: 200
    min-distance: 20
    max-distance: 64
    attempts: 48
  lifetime-ticks: 6000
  # Öffnen und Schließen (Animation)
  open-ticks: 16
  # 3 Lichtblöcke der Stufe 15 im Riss (nur in Luft, werden sicher wieder entfernt)
  light: true
  # Leuchtfeuer-Summen für Spieler in 32 Blöcken
  ambient-sound: true
  # Mobs meiden Risse (Pfade, die hineinführen, werden abgebrochen)
  mob-avoidance: true
  # nach einer Reise wirkt kein Riss, bis man ihn verlassen hat und diese Zeit vorbei ist
  reentry-cooldown-ticks: 100
  # Risse von Admins (/sift rift open, Item sift_rift): nächster Platz in diesem Umkreis (Blöcke, Höhe ±),
  # nur 9 × 5 Blöcke Luft nötig, kein Boden (auch in hügeligem Gelände)
  admin:
    search-radius: 12
    search-height: 6
  # Gegen-Riss am Respawnpunkt: vorhandenen in diesem Umkreis weiterverwenden, sonst in Ringen suchen
  counter:
    reuse-radius: 64
    min-radius: 16
    max-radius: 256
    step: 16
    angles: 16
    # nicht im Spawn-Schutz (spawn-protection in server.properties)
    respect-spawn-protection: true
    # nur, wo der Spieler bauen darf (Claim-Plugins wie GriefPrevention, WorldGuard, Lands werden gefragt)
    respect-claims: true

siftite:
  # Siftit-Erhalt beim Tod (ab alpha.23) wie im Original: Siftit-Gegenstände (Tag the_sift:siftite_items)
  # werden beim Tod gesichert (nicht bei keepInventory) und kommen nach dem Respawn über einen Mini-Riss
  # einzeln zurück. Notausgang: /sift siftite list|restore <Spieler>
  keep-on-death:
    enabled: true
    # Wartezeit nach Respawn oder Login
    delay-ticks: 40
    # alle so viele Ticks fliegt ein weiterer Gegenstand aus dem Mini-Riss
    emit-interval-ticks: 5
    # Öffnen und Schließen des Mini-Risses
    open-ticks: 12
    particles: true

access:
  # Ab wann die Sift betreten werden kann:
  #   always       = immer offen (Standard)
  #   after-dragon = delay-days Tage nach dem ersten Drachenkill
  #   fixed-date   = ab dem Zeitpunkt in date
  #   manual       = geschlossen, bis ein Admin /sift open eingibt
  # /sift open und /sift close setzen einen Zustand, der den Modus überstimmt und Neustarts übersteht;
  # /sift access reset kehrt zum Modus zurück. Spieler mit thesift.access.bypass kommen immer hinein.
  mode: always
  # Wartezeit nach dem ersten Drachenkill in Tagen (after-dragon), Kommazahlen erlaubt
  delay-days: 7
  # Öffnungszeitpunkt für fixed-date im ISO-Format, z. B. "2026-12-01T18:00" (ohne Zone = Server-Zeitzone)
  # oder "2026-12-01T18:00+01:00"
  date: ""
  # Vorwarnung in Sekunden, bevor Spieler beim Schließen aus der Sift geschickt werden
  close-warning-seconds: 30
  # Welten, deren Drachenkill zählt (Weltnamen). Leer = jede End-Welt
  dragon-worlds: []

portals:
  # Gestaffelte Freischaltung (ab alpha.42a.2): Jede Gruppe öffnet sich so viele Tage, nachdem die Sift geöffnet hat
  # (Tag 0: access.date bei fixed-date, Drachenkill + delay-days bei after-dragon, sonst der Moment, in dem das Plugin
  # die Sift zum ersten Mal offen sieht; per /sift portal schedule set-open festlegbar). Vorher ist ein Portal der
  # Gruppe versiegelt: Der Schlüssel öffnet es nicht (er bleibt erhalten), und auch ein schon offenes lässt niemanden
  # hinein. Schlüssel sind vorher herstellbar und auffindbar. thesift.access.bypass gilt wie bei der Zeitsperre. Das
  # Haupt-Portal in der Sift (der Weg hinaus) ist nie versiegelt. Kommazahlen erlaubt.
  unlock-schedule:
    enabled: true
    # End-Schreine
    end: 0
    # Portale in den Zentren der Antiken Städte (Oberwelt)
    ancient-city: 0
    # Nether-Schreine
    nether: 7
    # die übrigen Oberwelt-Schreine
    overworld: 14
  # Lichtstärke der Portalfläche (Original: 12)
  light-level: 12
  # alle N Ticks prüfen, wer eine offene Portalfläche berührt
  check-ticks: 2
  # Klingender Tiefenschiefer in diesem Umkreis um den Rahmen gehört als Konsole zum Portal (Original: 10)
  frame-radius: 10
  # Portal-Schreine (nur neue Chunks): einer je Zelle aus N × N Chunks, im mittleren Drittel der Zelle;
  # min-distance = Abstand von 0/0 in Blöcken, den der Schrein mindestens hat (End: äußere Inseln).
  # Eigene Vorlage statt des eingebauten Schreins: plugins/TheSift/structures/<overworld|nether|end>.nbt
  structures:
    overworld: {enabled: true, cell-chunks: 64, min-distance: 0}
    nether: {enabled: true, cell-chunks: 16, min-distance: 0}
    end: {enabled: true, cell-chunks: 32, min-distance: 1100}
  # Schlüssel (seit alpha.37 der einzige Weg, ein Portal zu öffnen): Rechtsklick mit dem passenden Schlüssel auf eine
  # Konsole weckt die Konsolen nacheinander, dann zündet das Portal und öffnet sich (keine Melodie mehr).
  # loot: Vanilla-Truhen, in denen der Schlüssel mit der Chance liegt (0 = nie). Die Rezepte stehen unter recipes.
  keys:
    # false = Schlüssel öffnen keine Portale mehr, nur noch Admins (/sift portal activate)
    enabled: true
    # true = der Schlüssel wird beim Öffnen verbraucht (nicht im Kreativmodus; ein schon geweckter Konsolenkreis
    # aus der Zeit vor alpha.37 öffnet sich ohne Verbrauch)
    consume: true
    overworld:
      item: echo_resonator
      loot: {tables: ["minecraft:chests/ancient_city"], chance: 0.03}
    nether:
      item: soul_ember_core
      loot: {tables: ["minecraft:chests/bastion_treasure", "minecraft:chests/bastion_other", "minecraft:chests/bastion_bridge", "minecraft:chests/bastion_hoglin_stable"], chance: 0.03}
    end:
      # schwerste Stufe: nur über das Rezept
      item: void_resonator
      loot: {tables: ["minecraft:chests/end_city_treasure"], chance: 0.0}
    # Portal im Zentrum der Antiken Stadt: eigener Schlüssel ohne Rezept, nur als seltener Truhenfund dort
    # (ersetzt seit alpha.37 die geheime Melodie und das Buch)
    ancient-city:
      item: ancient_resonator
      loot: {tables: ["minecraft:chests/ancient_city"], chance: 0.01}
  # Portal im Zentrum jeder neuen Antiken Stadt (wie im Original), zusätzlich zu den Schreinen. [Start]
  # Öffnen: Antiker Resonator (portals.keys.ancient-city).
  ancient-city:
    enabled: true
  # Sift-Kompass: Nadel und Entfernung (Actionbar) alle N Ticks auffrischen, solange man ihn hält
  compass:
    update-ticks: 40
  # Rezepte der Schlüssel und des Kompasses (Format wie Vanilla-Rezeptdateien, Neustart nötig). Gestaffelt
  # Oberwelt < Nether < End. Zutaten: Vanilla-Items ("minecraft:x"), Tags ("#minecraft:x") und Sift-Items
  # ("the_sift:x", z. B. spätere Boss-Items). Ein ungültiges Rezept (Tippfehler, Item gibt es nicht) wird mit einer
  # Warnung im Log durch das eingebaute gleichen Namens ersetzt. Weitere Rezepte für denselben Schlüssel: neuer Name,
  # gleiches result.
  recipes:
    # Oberwelt: Schwerer Kern (Ominous-Tresor der Prüfungskammern), 4 Echo-Splitter, Sculk-Katalysator
    echo_resonator:
      type: minecraft:crafting_shaped
      category: misc
      pattern: [" E ", "EHE", " C "]
      key: {E: "minecraft:echo_shard", H: "minecraft:heavy_core", C: "minecraft:sculk_catalyst"}
      result: {id: "the_sift:echo_resonator"}
    # Nether: 3 Wither-Skelett-Schädel, Netherit-Barren, 2 Ghast-Tränen, Lohenrute
    soul_ember_core:
      type: minecraft:crafting_shaped
      category: misc
      pattern: ["WWW", "GNG", " B "]
      key: {W: "minecraft:wither_skeleton_skull", G: "minecraft:ghast_tear", N: "minecraft:netherite_ingot", B: "minecraft:blaze_rod"}
      result: {id: "the_sift:soul_ember_core"}
    # End (schwerste Stufe): Drachenkopf und Elytren (beide vom Endschiff, auch nach dem Drachenkill), 2 Shulker-Schalen,
    # geplatzte Chorusfrucht. Drachenatem gibt es nur bei lebendem Drachen und ist deshalb nicht dabei.
    void_resonator:
      type: minecraft:crafting_shaped
      category: misc
      pattern: [" D ", "SES", " P "]
      key: {D: "minecraft:dragon_head", S: "minecraft:shulker_shell", E: "minecraft:elytra", P: "minecraft:popped_chorus_fruit"}
      result: {id: "the_sift:void_resonator"}
    sift_compass:
      type: minecraft:crafting_shaped
      category: misc
      pattern: ["AEA", "ECE", "AEA"]
      key: {A: "minecraft:amethyst_shard", E: "minecraft:echo_shard", C: "minecraft:compass"}
      result: {id: "the_sift:sift_compass"}

items:
  siftite:
    # Werkzeuge und Waffen (Basis: Netherit 2031 / 9 / +4)
    tools:
      durability: 2200
      # Abbaugeschwindigkeit auf passenden Blöcken
      mining-speed: 9.5
      # Schadensbonus wie bei Werkzeugmaterialien (Schwert: 1 + 3 + Bonus = 8,5 statt 8)
      attack-damage-bonus: 4.5
    # Rüstung (Basis: Netherit 37 / 3 / 0,1); Rüstungspunkte wie Netherit
    armor:
      # Haltbarkeit = Faktor × 11/16/15/13 (Helm/Brustpanzer/Beinschutz/Stiefel)
      durability-multiplier: 39
      toughness: 3.0
      knockback-resistance: 0.12
  # Essen: Nahrungspunkte und Sättigung (wie Schweinefleisch roh/gebraten)
  food:
    raw_sifter_meat: {nutrition: 3, saturation: 1.8}
    cooked_sifter_meat: {nutrition: 8, saturation: 12.8}
  # Getränke: Farbe und Effekte (Dauer in Ticks, Stufe 0 = I)
  drinks:
    ichor_bottle:
      color: "#5a2a83"
      effects:
        - {type: regeneration, duration: 60, amplifier: 0}
  # Schallplatten: Lied aus dem Datapack
  music-discs:
    music_disc_rift: "the_sift:rift"
    music_disc_wellspring: "the_sift:wellspring"

mobs:
  # Sift-Mobs (Phase 2) an/aus. [Start]
  # Jeder Mob ist ein unsichtbarer Vanilla-Mob (Hitbox, Wegfindung) mit einem Modell aus Item-Displays.
  enabled: true
  render:
    # alle N Ticks eine neue Pose senden (2 = 10 pro Sekunde); der Client interpoliert dazwischen
    update-ticks: 2
    # Dauer der Interpolation in Ticks (etwas länger als update-ticks wirkt weicher)
    interpolation-ticks: 3
    # Sichtweite der Modelle in Blöcken (bei Standard-Einstellungen des Clients)
    view-range: 48
    # Färbung beim Treffer (wie das rote Aufblinken bei Vanilla) und ihre Dauer in Ticks
    hurt-color: "#FF8080"
    hurt-ticks: 10
    # Posen nur senden, solange ein Spieler das Modell sieht (false nur zum Testen)
    only-when-watched: true
  limits:
    # höchstens so viele Sift-Mobs je Welt (alle Arten zusammen)
    per-world: 150
    # natürliches Spawnen nur, solange um den Spieler (Umkreis in Blöcken) weniger Sift-Mobs sind
    per-player: 8
    player-radius: 64

  # Blub (Original: BlubEntity). Basis ist ein unsichtbarer Wolf.
  blub:
    enabled: true
    # Größe des Basis-Wolfs (Attribut scale; 1,1 ergibt etwa 0,66 × 0,94, Original 0,8 × 0,9)
    base-scale: 1.1
    # Größe des Modells (1 = wie im Original)
    model-scale: 1.0
    # Schatten unter dem Modell (Original 0,38)
    shadow-radius: 0.38
    attributes:
      max-health: 20.0
      movement-speed: 0.3
      attack-damage: 3.0
      follow-range: 24.0
      tempt-range: 10.0
      step-height: 1.0
    # Zähmen mit einem Seelenblock: Erfolg mit Chance 1 zu N (Original 3)
    tame-one-in: 3
    # gezähmt und verletzt: Seelenblock oder Essen heilt so viele Lebenspunkte
    feed-heal: 4.0
    # Seelenblock in der Hand lockt (Tempo-Faktor, Pause in Ticks nach dem Verlieren)
    tempt-speed: 1.1
    tempt-cooldown-ticks: 100
    # Rudelzorn: schlägt ein Spieler einen ungezähmten Blub, greifen alle ungezähmten im Umkreis an
    pack-anger:
      radius: 16
      ticks: 600
    hopping:
      # Sprunghöhe normal / beim Angriff / bergauf (Original 0,3 / 0,36 / 0,5)
      jump-power: 0.3
      fast-jump-power: 0.36
      climb-jump-power: 0.5
      # Wartezeit am Boden nach der Landung: normal, schnell (Folgen, Locken), Angriff
      landing-delay-ticks: [8, 6, 4]
      # Vorwärtstempo je Sprung in Blöcken pro Tick (bei movement-speed 0,3)
      hop-velocity: 0.2
    # Ohrenflattern im Stand alle [min, max] Ticks, Dauer in Ticks
    flap-interval-ticks: [140, 540]
    flap-ticks: 20
    # zusätzliches Zirpen alle [min, max] Ticks (neben dem normalen Umgebungsklang)
    idle-sound-interval-ticks: [180, 540]
    # Erfahrung beim Tod [min, max] (Original: wie Vanilla-Tiere 1–3)
    experience: [1, 3]
    # Natürliches Spawnen (im Original gibt es keins, nur das Spawn-Ei): selten in den Überwucherten Biomen
    spawn:
      enabled: true
      # alle N Ticks je Spieler ein Versuch, im Ring von min- bis max-distance Blöcken
      interval: 80
      min-distance: 32
      max-distance: 76
      # Anteil der Versuche an der Oberfläche (Rest in Höhlen)
      surface-chance: 1.0
      # Gruppengröße [min, max]
      group: [1, 3]
      # Grenze (cap) zählt Blubs im Umkreis cap-radius um den Spawnpunkt
      cap-radius: 64
      profiles:
        - {biomes: [overgrown_clearing, overgrown_forest, overgrown_forest_slopes, overgrown_slopes, overgrown_peaks], chance: 0.15, cap: 4}

  # Sifter (Original: SifterEntity). Basis ist ein unsichtbares Schwein (Hitbox 0,9 × 0,9, Original 0,9 × 0,95).
  # Feindlich: jagt Spieler, spawnt nicht auf Friedlich und verschwindet dort wie ein Monster.
  sifter:
    enabled: true
    base-scale: 1.0
    model-scale: 1.0
    shadow-radius: 0.42
    attributes:
      max-health: 40.0
      movement-speed: 0.31
      attack-damage: 10.0
      follow-range: 28.0
      step-height: 1.0
    # Tempo-Faktor beim Jagen (Original 1,18)
    chase-speed: 1.18
    # Tempo der Lauf-Animation (Original 2,5)
    running-animation-speed: 2.5
    bite:
      # Dauer des Bisses in Ticks, Klang und Schaden in diesem Tick (Original 14 / 8 / 13)
      ticks: 14
      sound-tick: 8
      damage-tick: 13
      # der Schaden trifft nur bis zu dieser Entfernung (Blöcke, Mitte zu Mitte) und mit Sichtlinie
      reach: 2.5
      # Pause zwischen zwei Bissen in Ticks (Vanilla-Nahkampf 20)
      cooldown-ticks: 20
      # ein Biss beginnt, wenn die Hitbox, seitlich um so viel verbreitert, das Ziel berührt (Vanilla 0,83)
      start-range-inflate: 0.8286
    drops:
      # rohes Sifterfleisch [min, max], je Plünderungs-Stufe 0 bis looting-bonus mehr; brennend gebraten
      raw-meat: [1, 2]
      looting-bonus: 1
    # Erfahrung, wenn ein Spieler ihn tötet (Original 7)
    experience: 7
    # Spawner des Originals (SiftSifterSpawner)
    spawn:
      enabled: true
      interval: 80
      # bis zu so viele Punkte auf einer Spirale um den Spieler; der erste, dessen Chance gelingt, spawnt
      attempts: 18
      min-distance: 32
      max-distance: 76
      surface-chance: 0.8
      # Gruppengröße [min, max] und Streuung der Gruppe in Blöcken
      group: [1, 5]
      group-spread: 4
      # Grenze (cap) zählt Sifter im Umkreis cap-radius um den Spawnpunkt (Original: Kasten 96 × 48 × 96)
      cap-radius: 96
      # nur auf diesen Blöcken der Sift
      floor-blocks: [siftslate, siftslate_growth, healthy_sculk, dry_healthy_sculk, dry_healthy_sculk_growth]
      # erste passende Zeile gilt; ohne Biome = alle übrigen Biome der Sift
      profiles:
        - {biomes: [overgrown_forest], chance: 0.36, cap: 8}
        - {biomes: [overgrown_clearing, overgrown_forest_slopes, overgrown_slopes, overgrown_peaks], chance: 0.28, cap: 6}
        - {biomes: [sift_wastes], chance: 0.22, cap: 5}
        - {biomes: [], chance: 0.18, cap: 5}

  # Singer (Original: SingerEntity). Basis ist ein unsichtbarer Fahrender Händler ohne eigene KI.
  # Gerufen (Ziegenhorn nahe einem schlafenden Portal): erscheint im Portal, singt, weckt die Konsolen, taucht ab.
  # Per Spawn-Ei oder /sift spawn: bleibt, läuft in der Nähe umher und tauscht Seelenblöcke.
  singer:
    enabled: true
    # Größe des Basis-Mobs (2,05 ergibt 1,23 × 4,0; Original 0,8 × 4,0 bei Größe 1,2)
    base-scale: 2.05
    # Größe des Modells (Original 1,2)
    model-scale: 1.2
    shadow-radius: 0.0
    attributes:
      max-health: 20.0
      movement-speed: 0.27
    # Erfahrung, wenn ein Spieler einen bleibenden Singer tötet [min, max] (Original 8–12)
    experience: [8, 12]
    # Ruf per Ziegenhorn: der Singer erscheint im nächsten schlafenden Portal und singt. Seit alpha.37 lassen seine
    # Schallwellen die Konsolen nur aufleuchten; öffnen kann das Portal nur der Schlüssel.
    summon:
      enabled: true
      # Verzögerung nach dem Ziegenhorn in Ticks und Suchradius um den Spieler in Blöcken (Original 60 / 40)
      delay-ticks: 60
      radius: 40
    song:
      # Lautstärke des Gesangs (Original 1000, also im weiten Umkreis hörbar)
      volume: 1000
      # Ticks nach Gesangsbeginn, zu denen eine Schallwelle zur nächsten Konsole startet (Original)
      wave-ticks: [3, 25, 42, 57, 75, 92, 98, 117]
      # Tempo der Schallwelle in Blöcken je Tick und Höhe des Kopfes über den Füßen
      wave-speed: 0.6
      head-height: 3.0
    # bleibender Singer: läuft nur in diesem Umkreis um seinen Erscheinungsort, nur auf Wegen mit Platz für
    # seine Höhe; hängt er so lange fest, taucht er ab
    leash-radius: 8
    stuck-seconds: 10
    # Seelen-Singer (Original): ein Echo Golem mit Seelenblock ruft ihn (sucht erst einen Singer in search Blöcken);
    # er nimmt den Block unter einer Verbeugung des Golems an und taucht nach roam-ticks ohne Golem wieder ab
    soul-event:
      enabled: true
      search: 52
      roam-ticks: 600
    barter:
      # so lange hält er den Seelenblock, bevor die Belohnung kommt (Ticks)
      hold-ticks: 40
      # Belohnungen des Originals: Gewicht (von 200) und Anzahl [min, max]; "#wool" = Wolle in zufälliger Farbe
      table:
        - {item: "minecraft:iron_block", weight: 30, count: [2, 4]}
        - {item: "minecraft:netherite_upgrade_smithing_template", weight: 20, count: [1, 1]}
        - {item: "minecraft:ancient_debris", weight: 19, count: [4, 8]}
        - {item: "the_sift:music_disc_wellspring", weight: 3, count: [1, 1]}
        - {item: "minecraft:gold_block", weight: 20, count: [1, 2]}
        - {item: "minecraft:wheat_seeds", weight: 11, count: [6, 16]}
        - {item: "minecraft:beetroot_seeds", weight: 9, count: [4, 8]}
        - {item: "minecraft:potato", weight: 10, count: [6, 16]}
        - {item: "minecraft:carrot", weight: 10, count: [8, 20]}
        - {item: "minecraft:netherite_ingot", weight: 11, count: [1, 1]}
        - {item: "minecraft:bookshelf", weight: 16, count: [4, 12]}
        - {item: "minecraft:end_stone", weight: 8, count: [2, 12]}
        - {item: "minecraft:chorus_flower", weight: 6, count: [1, 1]}
        - {item: "minecraft:echo_shard", weight: 5, count: [1, 3]}
        - {item: "minecraft:redstone_block", weight: 5, count: [4, 16]}
        - {item: "minecraft:string", weight: 8, count: [4, 16]}
        - {item: "#wool", weight: 9, count: [9, 24]}

  # Echo Golem (Original: EchoGolemEntity 1.1.1). Basis ist ein unsichtbares Schaf, Größe 1,28 (Hitbox 1,15 × 1,66,
  # Original 1,15 × 1,65). Holt Seelenblöcke aus Seelenschluchten und bringt sie einem Singer oder, mit einem
  # Echo-Splitter gebunden, seinem Spieler.
  echo_golem:
    enabled: true
    base-scale: 1.28
    model-scale: 1.0
    shadow-radius: 0.72
    attributes:
      max-health: 34.0
      movement-speed: 0.23
      follow-range: 128.0
      # Original 1,5: damit kommt er die Rampen der Schluchten sicher hinauf und hinunter
      step-height: 1.5
      knockback-resistance: 0.25
    # Erfahrung, wenn ein Spieler ihn tötet [min, max] (Original 4–7); Beute hat er keine
    experience: [4, 7]
    # Seelenblöcke aufheben (setzt sie zu Luft); nur in der Sift, die Gamerule mob_griefing gilt zusätzlich
    pickup:
      enabled: true
    # Gebundener Golem: Rechtsklick seines Spielers (ohne Echo-Splitter) übergibt den getragenen Seelenblock sofort
    # (ins Inventar, sonst vor die Füße). false = wie im Original: der Golem lässt ihn fallen und setzt sich.
    bonded:
      right-click-gives: true
    # Leuchten, während er einen Seelenblock trägt: model = leuchtender Seelenblock im Modell,
    # light-block = unsichtbarer Lichtblock in seinem Kopfblock (nur in Luft gesetzt, nur eigene entfernt), level 1–15
    glow:
      model: true
      light-block: true
      level: 14
    # höchstens so viele neue Wege je Server-Tick für alle Golems zusammen (Original 1)
    paths-per-tick: 1
    # Zeiten in Ticks (Original)
    timings:
      pickup-take: 18
      pickup-end: 34
      bow-give: 26
      bow-end: 48
      bow-timeout: 100
      sit: 600
      ignore-canyon: 600
      blocked-canyon: 2400
      empty-canyon: 6000
    # Suche (Blöcke, Ticks; Original)
    search:
      canyon-interval: 45
      canyon-range: 1024
      distant-canyon: 96
      scan-interval: 12
      scan-radius: 36
      scan-height: 26
      target-scan-radius: 16
      target-scan-height: 12
      hand-reach: 1.75
      approach-offset: 7
    # Abliefern: Singer-Suche, Reichweite zum gebundenen Spieler, Verbeugen, Patrouille (Original)
    delivery:
      singer-interval: 30
      singer-search: 52
      owner-range: 64
      bow-distance: 3
      patrol-leash: 64
      patrol-min: 14
      patrol-max: 60
    # Tempo je Abschnitt (Vielfaches des Lauftempos, Original)
    speeds: {explore: 0.78, approach: 0.88, enter: 0.84, descend: 0.82, soul: 0.9, exit: 0.88, owner: 0.82, singer: 0.86, patrol: 0.74, patrol-return: 0.76}
    # Erscheinen (Original 1.1.1): alle interval Ticks zuerst an einem Schlucht-Eingang, der noch auf seinen Golem
    # wartet (Ring bis entrance-ring Blöcke, höchstens entrance-max-dy höher/tiefer), sonst um Spieler ohne Golem
    # in spacing × spacing-vertical, min-distance bis max-distance Blöcke entfernt
    spawn:
      enabled: true
      interval: 80
      canyon-entrances: true
      entrance-ring: 12
      entrance-max-dy: 6
      near-players: true
      spacing: 165
      spacing-vertical: 96
      min-distance: 82
      max-distance: 160
      attempts: 28

  # Dunkler Schnüffler (Original: DarkSnifferEntity). Basis ist ein unsichtbarer Eisbär ohne eigenes Verhalten.
  # Modell: eigenes, vereinfachtes Modell auf der Original-Textur (nicht das Vanilla-Sniffer-Modell).
  # Hilfsgeister (Allays) in der Sift (ab alpha.31, Original 1.1.1): alle 80 Ticks für einen Spieler in der Sift bis zu
  # 18 Stellen 34–80 Blöcke entfernt, 6 Blöcke über dem Boden; die erste Stelle in einem der Biome entscheidet:
  # mit der Chance des Bioms erscheint eine Gruppe, höchstens bis zur Grenze im Umkreis (96 × 48 Blöcke).
  # Vanilla-Allays, unabhängig von mobs.enabled.
  allay:
    enabled: true
    interval-ticks: 80
    attempts: 18
    min-distance: 34
    max-distance: 80
    local-radius: 96
    local-height: 48
    profiles:
      overgrown_forest: {chance: 0.72, min-group: 2, max-group: 4, local-cap: 16}
      sift_wastes: {chance: 0.5, min-group: 2, max-group: 3, local-cap: 12}
      overgrown_clearing: {chance: 0.32, min-group: 1, max-group: 3, local-cap: 8}
  dark_sniffer:
    enabled: true
    # Größe des Basis-Eisbären (1,36 ergibt 1,9 × 1,9; Original 1,9 × 1,75)
    base-scale: 1.36
    model-scale: 1.0
    shadow-radius: 1.0
    attributes:
      max-health: 40.0
      # Tempo im Leerlauf; beim Jagen chase-movement-speed, Wegfaktor chase-speed (Original 0,1 / 0,3 / 1,2)
      movement-speed: 0.1
      attack-damage: 7.0
      follow-range: 32.0
      step-height: 1.25
      attack-knockback: 0.75
    chase-movement-speed: 0.3
    chase-speed: 1.2
    # zieht sich nicht weiter als so viele Blöcke von seinem Erscheinungsort zurück, solange er kein Ziel hat
    home-radius: 100
    # greift auch normale Schnüffler an (Original: ja); normale Schnüffler fliehen in diesem Umkreis vor ihm
    attack-sniffers: true
    sniffers-flee-radius: 20
    # Wächter sind Freunde (wie im Original): greifen ihn nie an, werden nicht wütend auf ihn, ihr Schallschlag
    # schadet ihm nicht; ruhige Wächter streicheln ihn ab und zu (Herzen)
    wardens-friendly: true
    wardens-pet: true
    # Streicheln (Werte des Originals, Zeiten in Ticks, [min, max]): Suche nach einem Dunklen Schnüffler im Umkreis,
    # Streicheln aus diesem Abstand für diese Dauer; Pausen danach, nach einem abgebrochenen Anlauf und ohne Fund
    warden-petting:
      search-range: 18
      reach: 3.5
      duration: 100
      approach-timeout: 240
      search-delay: [800, 2400]
      cooldown: [2400, 4800]
      failed-cooldown: [600, 1200]
      no-candidate-cooldown: [300, 600]
    combat:
      # sucht Spieler (Überleben/Abenteuer) und Schnüffler in diesem Umkreis
      aggro-range: 32
      # Nahkampf: Reichweite in Blöcken und Pause in Ticks (Original 3,15 / 24)
      reach: 3.15
      cooldown-ticks: 24
    # Schallangriff: bleibt das Ziel 8 Ticks außer Reichweite (und mindestens 5 Blöcke entfernt, in Sicht),
    # schnüffelt er 10 Ticks und schickt eine Schallwelle, die alles Getroffene zu ihm heranzieht (kein Schaden)
    sonic:
      enabled: true
      windup-ticks: 10
      cooldown-ticks: 100
      out-of-reach-ticks: 8
      min-distance: 5.0
      wave-speed: 1.5
      hit-radius: 0.8
      overshoot: 7.5
      max-lead-ticks: 20.0
      pull-strength: 0.3
    # Graben: ohne Ziel sucht er ab und zu Sculk in 8 Blöcken und gräbt dort Sculkblumensamen aus
    # (verändert keine Blöcke; Pause danach wie beim Vanilla-Schnüffler 9600 Ticks = 8 min)
    dig:
      enabled: true
      search-interval-ticks: 200
      duration-ticks: 80
      cooldown-ticks: 9600
    # Infektion: ein normaler Schnüffler, der auf Sculk gräbt, wird nach conversion-ticks zum Dunklen Schnüffler
    infection:
      enabled: true
      only-in-sift: true
      conversion-ticks: 600
      check-ticks: 10
    # Beute: Sculk-Blöcke; Erfahrung, wenn ein Spieler ihn tötet [min, max] (wie Vanilla-Tiere)
    drops:
      sculk: 1
    experience: [1, 3]
    # Spawn beim Generieren: 1–2 je neuer Sculk-Region an der Oberfläche der Sift (wie im Original)
    spawn:
      enabled: true

recipes:
  # Rezepte der Sift beim Betreten im Rezeptbuch freischalten
  discover-on-join: true

resource-pack:
  # Pack an alle Spieler beim Betreten senden
  enabled: true
  # Download-Adresse; {version} wird durch die Plugin-Version ersetzt (Release-Tag ohne "v")
  url: "https://github.com/KarldasLamaGaming/TheSiftPaperPlugin/releases/download/v{version}/the-sift-pack.zip"
  # SHA-1 des Packs. Leer = beim Start herunterladen und berechnen (Release-Datei the-sift-pack.zip.sha1)
  sha1: ""
  # true = Spieler müssen das Pack annehmen, sonst werden sie getrennt (kick-on-decline).
  # false = das Pack wird angeboten, Ablehnen ist erlaubt (Sift-Blöcke sehen dann wie Pilzblöcke aus)
  required: false
  # Fester Schlüssel des Packs beim Client; nur ändern, wenn mehrere Server unterschiedliche Packs senden
  uuid: "5f1a7c2e-3b84-4d6e-9a10-7c3e2b9d4f61"
  prompt: "<gold>The Sift</gold> <gray>braucht ein Resource Pack für Blöcke, Items und Texte.</gray>"
  kick-on-decline: "<red>Ohne das Resource Pack von The Sift kannst du hier nicht spielen.</red>\n<gray>Bitte nimm das Pack beim nächsten Verbinden an.</gray>"
  failed-message: "<red>Das Resource Pack von The Sift konnte nicht geladen werden.</red> <gray>Melde dich bitte bei einem Admin.</gray>"

# Eigene Inhalte nach dem Original-Port (Phase 4, ab alpha.39). Gegliedert nach Thema: boss-items, später
# enchanter, temples, bosses. Nichts davon gibt es im Original (siehe docs/ABWEICHUNGEN.md).
phase4:
  # Boss-Items aus den Vanilla-Bossen. Zutaten für den Sculk Enchanter (später) und als the_sift:<id> in
  # portals.recipes nutzbar. Gegen Farmen: nur Spieler-Kills, Chance und Abklingzeit je Spieler.
  boss-items:
    enabled: true
    # Herz des Wächters: jeder Wächter, den ein Spieler tötet
    warden-heart:
      enabled: true
      item: warden_heart
      chance: 1.0
      amount: 1
      # Stunden, bis derselbe Spieler wieder eins bekommt (0 = keine Abklingzeit)
      cooldown-hours: 0
    # Kern des Withers: jeder Wither, den ein Spieler tötet
    wither-core:
      enabled: true
      item: wither_core
      chance: 1.0
      amount: 1
      cooldown-hours: 0
    # Drachenschuppe: jeder Spieler, der dem Enderdrachen Schaden gemacht hat (auch nach einer Wiederbelebung;
    # die Endkristalle sind der Preis). min-damage-share: Mindestanteil am Schaden aller Spieler (0 = jeder Treffer)
    dragon-scale:
      enabled: true
      item: dragon_scale
      amount-per-player: 1
      min-damage-share: 0.0

  # Sculk Enchanter (ab alpha.40): hebt Verzauberungen über das Vanilla-Maximum. Entsteht im Ritual: Rechtsklick mit
  # dem Charoit-Kern auf einen Zaubertisch (kostet ritual-levels Erfahrungslevel und den Kern). Seit alpha.40.1 ein
  # eigener Block (Charoit-Rune oben, seelenblaue Gravur an den Seiten); öffnet ein eigenes Menü, droppt sich selbst.
  enchanter:
    enabled: true
    # block = eigener Block mit eigener Optik (ab alpha.40.1); table = markierter Zaubertisch (Rückfall, wie alpha.40)
    block-style: block
    # Langsam drehender Charoit-Kristall über dem Block (nur block-style: block); nicht gespeichert, beim Laden neu
    floating-crystal: true
    ritual-levels: 30
    # So viele Stufen über das Vanilla-Maximum (Schärfe V → VII); gesteigert wird nur, was schon auf dem Maximum ist,
    # immer eine Stufe pro Schritt
    max-bonus: 2
    # Höchstens so viele Verzauberungen eines Gegenstands über dem Maximum
    max-boosted-per-item: 2
    # Kosten je Schritt: auf Maximum +1 bzw. +2 (Charoit im Menü, Erfahrungslevel des Spielers)
    costs:
      plus-1: {charoite: 8, levels: 15}
      plus-2: {charoite: 16, levels: 30}
    # Einstufige Verzauberungen, die nie gesteigert werden
    single-level: [mending, silk_touch, infinity, aqua_affinity, channeling, flame, multishot, binding_curse, vanishing_curse]
    # Leer = alle mehrstufigen dürfen gesteigert werden; sonst nur diese (z. B. [unbreaking, efficiency])
    whitelist: []
    # Weniger Bonus für einzelne Verzauberungen (0 = gar nicht steigerbar). Glück und Plünderung nur +1 (Wirtschaft).
    # Für PvP z. B. sharpness: 1, protection: 0, power: 1 eintragen.
    max-bonus-per-enchantment:
      fortune: 1
      looting: 1
    # Amboss: gesteigerte Stufen bleiben beim Kombinieren erhalten (Vanilla würde sie auf das Maximum kürzen)
    anvil-keeps-boost: true
    # Der fest verbaute Enchanter im Tempel (ab alpha.41a): erst nutzbar, wenn der Wächter des Tempels besiegt ist
    temple-enchanter:
      requires-defeat: true
  # Tempel (ab alpha.41a, Bastion ab alpha.41.1) [Start]: genau count Tempel je Sift, auf einem Ring um 0/0, aus dem Seed
  # berechnet (nur neue Chunks). Eine zerfallene Bastion (Standard 81 × 81): Ringmauer mit Wehrgang, Rundtürme, Torhaus im
  # Süden, Spalte mit Brücken zum erhöhten Kern; in der Mitte ein offener Schacht hinab zur Arena mit dem Seelen-Altar
  # (Boss ab alpha.42). Darunter die Prüfungsebene: Ringgang mit Speichen, Kammern, die Schatzhalle mit festem Sculk
  # Enchanter und zwei Truhen, sowie zwei versiegelte Prüfungsräume (Wither, Wächter). Jeder Wächter lässt sich einmal
  # besiegen (je Tempel). Andere Strukturen halten Abstand.
  temples:
    enabled: true
    count: 10
    # Abstand zu 0/0 in Blöcken; eine kleinere Weltgrenze der Sift zieht den Ring nach innen (Warnung im Log)
    ring:
      min-radius: 1500
      max-radius: 3000
      # zufällige Abweichung vom gleichmäßigen Winkel, in Grad
      angle-jitter: 15
    # Größe (ab alpha.41.1, nur für neu generierte Tempel): radius = halbe Seitenlänge des Hofs (40 bis 64, 40 = 81 × 81),
    # Höhe der Mauern und der Ecktürme über dem Hof, Tiefe der Prüfungsebene unter dem Hof (16 bis 24)
    size:
      radius: 40
      wall-height: 14
      tower-height: 26
      depth: 16
    # Zusätzlicher Abstand anderer Strukturen zur Tempelfläche, in Blöcken
    clearance: 8
    # Teile eines Tempels, deren Chunk vor der Tempelmitte generiert wurde, baut das Plugin danach auf dem Main-Thread
    # nach, sobald der Chunk geladen ist: so viele Chunks je Tick (ab alpha.41.1)
    deferred-per-tick: 1
    # Tempelblöcke lassen sich bis zum Sieg nicht abbauen oder sprengen (Enchanter, Altar und Kammern immer)
    protect-until-defeated: true
    # Beute der zwei Truhen in der Schatzhalle (Datapack)
    loot-table: "the_sift:chests/temple"
    # Text beim Rechtsklick auf den Seelen-Altar, solange der Boss aus ist (phase4.bosses.great-echo-golem.enabled)
    altar-message: "Der Seelen-Altar schweigt noch."
    # Sift-Kompass (ab alpha.41b): in der Sift wechselt Schleichen + Rechtsklick zwischen Hauptportal und dem nächsten
    # Tempel, dessen Wächter noch schläft (auch noch nicht generierte). Besiegte Tempel zeigt er nicht.
    compass:
      enabled: true
    # Brut-Spawner (ab alpha.42a): 12 je Tempel (Prüfungsspawner-Optik), fest im Bauplan. Zone 1 in den Kasernen im Hof,
    # Zone 2 in den Kammern der Prüfungsebene, Zone 3 im inneren Ringgang an der Arena. Ein Spieler im Umkreis weckt einen
    # Spawner; er schickt Wellen von Sift-Mobs und ist nach der letzten erschöpft. Brut-Mobs geben keine Beute. Bestehende
    # Tempel bekommen die Spawner mit /sift temple rebuild <id>. Nach dem Sieg sind alle Spawner aus.
    spawners:
      enabled: true
      # Spieler in so vielen Blöcken wecken einen Spawner
      activation-radius: 12
      # Pause zwischen zwei Wellen, in Sekunden
      wave-delay-seconds: 5
      # Nach der letzten Welle ruht ein Spawner so lange (Minuten); 0 = bis /sift temple spawners reset oder Tempel-Reset
      cooldown-minutes: 30
      # Höchstens so viele lebende Brut-Mobs je Tempel
      max-alive-per-temple: 16
      # Brut-Mobs verschwinden, wenn so lange (Sekunden) kein Spieler in despawn-radius Blöcken war; der Spawner fängt
      # dann beim nächsten Besuch wieder mit Welle 1 an
      despawn-radius: 48
      despawn-seconds: 30
      # Mobs je Welle steigen mit jedem weiteren Spieler (bis zu so vielen Spielern)
      max-players-scaled: 4
      # Gegen Farmen: Erfahrung der Brut-Mobs mal diesem Faktor (0 = keine), Beute ja/nein
      experience-factor: 0.0
      drops: false
      # Der Seelen-Altar erwacht erst, wenn alle Spawner seines Tempels erschöpft sind (Boss ab alpha.42b);
      # hängt ein Spawner, beendet /sift temple spawners clear <id> alle
      altar-gate: true
      # Je Zone: Wellen, Mobs je Welle für einen Spieler, dazu je weiterem Spieler, Sift-Mobs (zufällig gewählt)
      zones:
        "1":
          enabled: true
          waves: 2
          mobs-per-wave: 2
          per-extra-player: 1
          mobs: [sifter]
        "2":
          enabled: true
          waves: 3
          mobs-per-wave: 2
          per-extra-player: 1
          mobs: [sifter, dark_sniffer]
        "3":
          enabled: true
          waves: 3
          mobs-per-wave: 3
          per-extra-player: 1
          # alpha.42a.3 bringt das Charoit-Irrlicht für diese Zone
          mobs: [dark_sniffer]
    # Gerüchte-Zettel (ab alpha.41b): Item "temple_rumor" mit Himmelsrichtung und gerundeter Entfernung vom Fundort zum
    # nächsten schlafenden Tempel (nie zum eigenen). Nur in der Sift; außerhalb und bei ausgeschalteten Tempeln wird
    # er aus der Beute genommen.
    hints:
      enabled: true
      # Loot-Tabelle -> Chance auf einen Zettel je Truhe (0 bis 1). Eine eigene Loot-Tabelle im Datapack kann den
      # Zettel auch selbst enthalten (Papier mit custom_data the_sift:id = temple_rumor).
      chests:
        "the_sift:chests/abandoned_portal": 0.35
        "the_sift:chests/temple": 0.6
      # Entfernung auf ein Vielfaches davon gerundet, in Blöcken
      distance-step: 100
      # Zeilen des Zettels (MiniMessage), <direction> = Himmelsrichtung, <distance> = Entfernung
      text:
        - "<gray>Ein Gerücht aus der Sift:"
        - "<dark_aqua>Ein schlafender Tempel liegt etwa <white><distance></white> Blöcke im <white><direction></white>."
      # Zeilen, wenn alle Tempel besiegt sind
      all-defeated:
        - "<gray>Ein Gerücht aus der Sift:"
        - "<dark_aqua>Alle Tempel sind verstummt."
  # Bosse der Tempel (ab alpha.42b). Nichts davon gibt es im Original.
  bosses:
    # Großer Echo-Golem (Charoit-Koloss): erwacht am Seelen-Altar in der Arena, einmal je Tempel. Danach ist der Tempel
    # besiegt (Enchanter frei, Spawner aus, Kompass zeigt ihn nicht mehr); zurück nur per /sift temple reset <id>.
    great-echo-golem:
      enabled: true
      start:
        # Opfergabe: so viele dieser Items in der Haupthand beim Rechtsklick auf den Altar (werden verbraucht)
        offering: "the_sift:soul_block"
        amount: 8
        # Countdown nach der Opfergabe; wer dann in der Arena steht, zählt für die Lebenspunkte
        countdown-seconds: 5
      health:
        # Lebenspunkte: Grundwert, +Anteil je weiterem Spieler beim Start, gezählt bis zu so vielen Spielern
        base: 600
        per-extra-player: 0.5
        max-players-scaled: 4
      phases:
        # Panzer bis 60 % (endet erst mit der letzten Platte), Wut unter 25 %
        armor-until: 0.6
        enrage-below: 0.25
        # Seelenplatten am Körper (höchstens 12); jeder Nahkampftreffer bricht eine ab, Geschosse prallen ab
        armor-plates: 12
        # Abgeschlagene Platten fallen dem, der sie abschlug, als Seelenblock zu
        plates-drop: true
        # Seelenruf zu Beginn der Schallphase: so viele Helfer holen Seelen aus dem Arenaboden; je gebrachte Seele
        # eine neue Platte (höchstens rearmor-plates). Ein Treffer lässt sie die Seele fallen.
        helpers: 2
        rearmor-plates: 6
      attacks:
        # Faustschlag: Schaden, Reichweite ab Körpermitte (Blöcke), Abklingzeit (Ticks)
        melee: {damage: 14, reach: 3.5, cooldown-ticks: 30}
        # Stampfer: Schaden in der Mitte (am Rand die Hälfte), Umkreis, Vorwarnung (roter Ring), Abstand normal / in Wut
        slam: {damage: 8, radius: 6, windup-ticks: 20, interval-ticks: 240, interval-ticks-rage: 120}
        # Schallwelle (ab Phase 2): Schaden, Aufladen, Abstand normal / in Wut
        sonic: {damage: 10, windup-ticks: 40, interval-ticks: 200, interval-ticks-rage: 140}
        # Tempo in der Wut (Faktor)
        rage-speed: 1.3
      arena:
        # Seelengitter: Wer in der Arena kämpft, kommt erst nach Sieg, Tod oder Abbruch wieder hinaus (Eintritt geht immer)
        seal-gates: true
        # Höhe der Arena über dem Boden; nur wer darin steht, kämpft und macht Schaden (kein Beschuss von oben)
        height: 10
      reset:
        # Abbruch, wenn so lange kein lebender Kämpfer in der Arena war; der Tempel schläft dann wieder
        leave-seconds: 30
        # Opfergabe beim Abbruch zurückgeben
        refund-offering: false
      loot:
        # Beute bekommt, wer mindestens diesen Anteil der Lebenspunkte abgezogen hat oder beim Tod in der Arena steht
        min-damage-share: 0.05
        # Nachtkristalle je berechtigtem Spieler (weitere Beute folgt mit alpha.42b.2)
        night-crystal: 1
      # Aussehen: Größe des Modells, Hitbox (Schaf-Skalierung), Farbton normal / in Wut, Charoit-Krone und Kern
      model-scale: 2.5
      base-scale: 3.2
      tint: "#9E8CE0"
      tint-rage: "#E07890"
      model:
        crown: true
      attributes:
        movement-speed: 0.24
      experience: 300
      # Seelenhelfer (Echo Golems des Seelenrufs)
      helper:
        max-health: 34
        movement-speed: 0.26
  # Rezepte der Phase-4-Items (Format wie portals.recipes, Rückfall auf das eingebaute Rezept bei Fehlern)
  recipes:
    # Charoit-Kern (Arbeitstitel): 5 Charoit, Herz des Wächters, Drachenschuppe, Kern des Withers, Siftitbarren
    charoite_core:
      type: minecraft:crafting_shaped
