# The Sift – Texte für Spieler (MiniMessage: https://docs.advntr.dev/minimessage/format.html)
# Platzhalter stehen in <spitzen Klammern>, z. B. <mob>. Neue Texte eines Updates werden beim Start ergänzt.
# Bestehende Texte des Plugins ziehen nach und nach hierher um.

mobs:
  names:
    blub: "Blub"
    sifter: "Sifter"
    singer: "Singer"
    dark_sniffer: "Dunkler Schnüffler"
    echo_golem: "Echo Golem"
  spawned: "<green><count> × <mob> erschienen."
  spawn-failed: "<red><mob> konnte hier nicht erscheinen (<reason>)."
  unknown: "<red>Unbekannter Sift-Mob: <mob>"
  disabled: "<red><mob> ist in der config.yml abgeschaltet (mobs.<id>.enabled)."
  limit-world: "Grenze von <limit> Sift-Mobs in dieser Welt erreicht"
  echo_golem:
    # Übergabe des Seelenblocks bei vollem Inventar
    inventory-full: "<yellow>Inventar voll: Der Echo Golem legt dir den Seelenblock vor die Füße."

# Zeitsperre der Sift (config access.*)
access:
  # Ankündigung an alle, wenn die Sift öffnet
  opened: "<light_purple><bold>Die Sift ist geöffnet!</bold></light_purple> <gray>Die Portale führen jetzt hinein."
  # Actionbar, wenn jemand ohne Zugang hinein will
  closed: "<red>Die Sift ist geschlossen."
  closed-until: "<red>Die Sift ist geschlossen <gray>(öffnet in <time>)"
  # Chat beim Beginn des Countdowns und Actionbar jede Sekunde
  closing: "<red>Die Sift schließt in <seconds> Sekunden. <gray>Danach wirst du zurückgeschickt."
  countdown: "<red>Die Sift schließt in <seconds> s"
  sent-back: "<gray>Die Sift ist geschlossen, du wurdest zurückgeschickt."

# Risse (config rifts.*)
rifts:
  no-space: "<red>Nicht genug Platz für den Riss"
  no-exit: "<red>Der Riss konnte in sinnvoller Entfernung nicht geöffnet werden, du landest am Spawnpunkt."

# Siftit-Erhalt beim Tod (config siftite.keep-on-death.*)
siftite:
  inventory-full: "<yellow>Inventar voll: Deine Siftit-Gegenstände warten, bis Platz ist."
