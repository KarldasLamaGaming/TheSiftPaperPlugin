# The Sift – Texte für Spieler auf Deutsch (MiniMessage: https://docs.advntr.dev/minimessage/format.html)
# Spieler mit deutschem Client bekommen diese Datei, alle anderen messages_en.yml (ab alpha.42c).
# Platzhalter stehen in <spitzen Klammern>, z. B. <mob>. Neue Texte eines Updates werden beim Start ergänzt.

mobs:
  names:
    blub: "Blub"
    sifter: "Sifter"
    singer: "Singer"
    dark_sniffer: "Dunkler Schnüffler"
    echo_golem: "Echo Golem"
    great_echo_golem: "Großer Echo-Golem"
    soul_helper: "Seelenhelfer"
  spawned: "<green><count> × <mob> erschienen."
  spawn-failed: "<red><mob> konnte hier nicht erscheinen (<reason>)."
  unknown: "<red>Unbekannter Sift-Mob: <mob>"
  disabled: "<red><mob> ist in der config.yml abgeschaltet (mobs.<id>.enabled)."
  limit-world: "Grenze von <limit> Sift-Mobs in dieser Welt erreicht"
  echo_golem:
    # Übergabe des Seelenblocks bei vollem Inventar
    inventory-full: "<yellow>Inventar voll: Der Echo Golem legt dir den Seelenblock vor die Füße."

# Zeitsperre der Sift (config access.*)
access:
  # Ankündigung an alle, wenn die Sift öffnet
  opened: "<light_purple><bold>Die Sift ist geöffnet!</bold></light_purple> <gray>Die Portale führen jetzt hinein."
  # Actionbar, wenn jemand ohne Zugang hinein will
  closed: "<red>Die Sift ist geschlossen."
  closed-until: "<red>Die Sift ist geschlossen <gray>(öffnet in <time>)"
  # Chat beim Beginn des Countdowns und Actionbar jede Sekunde
  closing: "<red>Die Sift schließt in <seconds> Sekunden. <gray>Danach wirst du zurückgeschickt."
  countdown: "<red>Die Sift schließt in <seconds> s"
  sent-back: "<gray>Die Sift ist geschlossen, du wurdest zurückgeschickt."

# Risse (config rifts.*)
rifts:
  no-space: "<red>Nicht genug Platz für den Riss"
  no-exit: "<red>Der Riss konnte in sinnvoller Entfernung nicht geöffnet werden, du landest am Spawnpunkt."
  disabled: "<gray>Risse sind abgeschaltet."

# Siftit-Erhalt beim Tod (config siftite.keep-on-death.*)
siftite:
  inventory-full: "<yellow>Inventar voll: Deine Siftit-Gegenstände warten, bis Platz ist."

# Allgemein
general:
  # <item> = Name des Gegenstands
  you-receive: "<light_purple>Du erhältst: <white><item>"
  you-receive-list: "<light_purple>Du erhältst: <white><items>"

# Ichor (config ichor.*)
ichor:
  no-mix: "Ichor und Wasser mischen sich nicht."

# Eigene Blöcke (config custom-blocks.*)
blocks:
  only-in-sift: "<red>Sift-Blöcke lassen sich nur in der Sift platzieren."
  cannot-grow: "<red>Kann hier nicht wachsen."

# Portale, Konsolen, Staffel (config portals.*)
portals:
  sound: "<gray>Klang <white><bold><sound></bold></white> von <count>"
  main-not-built: "Das Haupt-Portal der Sift ist noch nicht gebaut."
  keys-disabled: "Schlüssel sind abgeschaltet; nur ein Admin öffnet Portale."
  no-portal: "Diese Konsole gehört zu keinem Portal."
  already-open: "Dieses Portal ist schon offen."
  wrong-key: "Dieser Schlüssel passt nicht zu diesem Portal."
  consoles-wake: "Die Konsolen erwachen."
  console-sleeps: "Die Konsole schläft. Der passende Schlüssel öffnet das Portal."
  singer-echo: "<light_purple>Die Konsolen hallen nach und schlafen weiter.</light_purple> <gray>Nur der passende Schlüssel öffnet dieses Portal."
  # Gestaffelte Freischaltung: <date> = Datum, <time> = Restzeit
  sealed-at: "<dark_purple>Dieses Portal ist noch versiegelt. Es öffnet sich am <date> (in <time>)."
  sealed: "<dark_purple>Dieses Portal ist versiegelt."
  sealed-until-open: "<dark_purple>Dieses Portal ist noch versiegelt; es öffnet sich erst, wenn die Sift offen ist."

# Sift-Kompass (config portals.compass.*, phase4.temples.compass.*)
compass:
  temples-silent: "<gray>Alle Tempel sind verstummt"
  no-portal: "<gray>Kein Portal in dieser Welt"
  temple: "<dark_aqua>Tempel: <distance> Blöcke"
  portal: "<light_purple>Portal: <distance> Blöcke"

