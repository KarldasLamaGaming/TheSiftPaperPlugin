# Sift items that are not blocks (blocks come from block-mapping.json automatically).
# Only identity data: category in /sift items, the vanilla base item, what the item does and the order.
# Balancing values (tools, armor, food, drinks, discs) live in config.yml under "items".
#   category: blocks | ores | plants_wood | tools | armor | materials | misc
#   base:     vanilla item the Sift item is built on
#   kind:     plain (default) | siftite-tool | siftite-armor | smithing-template | food | drink | music-disc
#   protect:  true = the item is never used like its vanilla base: vanilla recipes, smithing, anvil
#             repairs and trades refuse it. Set for every item here (all Sift materials, Siftite gear,
#             food, discs); ItemRegistryTest checks that none is missing. Block items (from
#             block-mapping.json) are always protected; Sift recipes (namespace the_sift) still take them.
items:
  charoite: {category: materials, base: "minecraft:paper", protect: true}
  siftite_nugget: {category: materials, base: "minecraft:paper", protect: true}
  siftite_ingot: {category: materials, base: "minecraft:paper", protect: true}
  siftite_upgrade_smithing_template: {category: materials, base: "minecraft:paper", kind: smithing-template, protect: true}
  ichor_shard: {category: materials, base: "minecraft:paper", protect: true}
  sculkflower_seeds: {category: plants_wood, base: "minecraft:paper", protect: true}
  ichor_snowball: {category: misc, base: "minecraft:snowball", protect: true}
  siftite_sword: {category: tools, base: "minecraft:netherite_sword", kind: siftite-tool, protect: true}
  siftite_shovel: {category: tools, base: "minecraft:netherite_shovel", kind: siftite-tool, protect: true}
  siftite_pickaxe: {category: tools, base: "minecraft:netherite_pickaxe", kind: siftite-tool, protect: true}
  siftite_axe: {category: tools, base: "minecraft:netherite_axe", kind: siftite-tool, protect: true}
  siftite_hoe: {category: tools, base: "minecraft:netherite_hoe", kind: siftite-tool, protect: true}
  siftite_spear: {category: tools, base: "minecraft:netherite_spear", kind: siftite-tool, protect: true}
  siftite_helmet: {category: armor, base: "minecraft:netherite_helmet", kind: siftite-armor, protect: true}
  siftite_chestplate: {category: armor, base: "minecraft:netherite_chestplate", kind: siftite-armor, protect: true}
  siftite_leggings: {category: armor, base: "minecraft:netherite_leggings", kind: siftite-armor, protect: true}
  siftite_boots: {category: armor, base: "minecraft:netherite_boots", kind: siftite-armor, protect: true}
  raw_sifter_meat: {category: misc, base: "minecraft:paper", kind: food, protect: true}
  cooked_sifter_meat: {category: misc, base: "minecraft:paper", kind: food, protect: true}
  ichor_bottle: {category: misc, base: "minecraft:paper", kind: drink, protect: true}
  music_disc_rift: {category: misc, base: "minecraft:paper", kind: music-disc, protect: true}
  music_disc_wellspring: {category: misc, base: "minecraft:paper", kind: music-disc, protect: true}
  # portal keys (step 7b): right-click on a sleeping console of their dimension wakes the portal
  echo_resonator: {category: misc, base: "minecraft:paper", kind: portal-key, protect: true}
  soul_ember_core: {category: misc, base: "minecraft:paper", kind: portal-key, protect: true}
  void_resonator: {category: misc, base: "minecraft:paper", kind: portal-key, protect: true}
  sift_compass: {category: misc, base: "minecraft:compass", kind: sift-compass, protect: true}

# Items of the original that only exist as a vanilla item here (recipes produce the vanilla item)
item-substitutes:
  overgrown_willow_boat: "minecraft:mangrove_boat"
  overgrown_willow_chest_boat: "minecraft:mangrove_chest_boat"

# Blocks that exist only as placed blocks in the original (no item); they get no item here either.
blocks-without-item:
  - sculkflower_crop
